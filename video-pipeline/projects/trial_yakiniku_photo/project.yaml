# 試作: 写真だけで作る版（焼肉の動画から切り出した静止画7枚。うち1枚は HEIC、1枚は EXIF 回転付き JPEG）
# 写真は動かないので、カットごとに動き（ズーム・パン）を変えて単調にならないようにする
style: gothic
output: trial_yakiniku_photo.mp4

cuts:
