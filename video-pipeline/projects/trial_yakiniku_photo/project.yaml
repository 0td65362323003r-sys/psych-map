  - {src: photo_3.jpg,  dur: 1.2, move: zoom_out,  text: "お肉で作った\nバラの花に、"}
  - {src: photo_1.jpg,  dur: 1.1, move: pan_left,  text: "霜降りがずらり。"}
  - {src: photo_4.heic, dur: 1.2, move: zoom_in,   text: "ネギたっぷりの"}
  - {src: photo_5.jpg,  dur: 1.2, move: pan_right, text: "タン塩も\n外せないし、"}
  - {src: photo_6.jpg,  dur: 1.2, move: zoom_in,   text: "箸休めのキムチまで"}
  - {src: photo_7.jpg,  dur: 1.2, move: zoom_out,  text: "抜かりなし。"}
