# 試作: 焼肉（素材3本、店舗情報・本人の感想はまだ無し）
# 素材は容量が大きいのでリポジトリに入れない。--media で素材フォルダを指定する
style: gothic          # gothic（白太字ゴシック＋黒縁）/ mincho（白明朝＋影）
output: trial_yakiniku.mp4

# テロップは1つの文をカットごとに区切って次へつなげる（参考動画2本の共通パターン）
# move: zoom_in / zoom_out / pan_left / pan_right / none
cuts:
  - {src: IMG_9651.mov, start: 0.0, dur: 1.3, move: zoom_in,  text: "焼肉でこれが\n出てきたら、"}
  - {src: IMG_9651.mov, start: 1.6, dur: 1.1, move: zoom_out, text: "テンション\n上がらない人いる？"}
  - {src: IMG_9651.mov, start: 4.0, dur: 1.1, move: zoom_in,  text: "お肉で作った\nバラの花に、"}
  - {src: IMG_9651.mov, start: 6.2, dur: 1.2, move: zoom_in,  text: "霜降りがずらり。"}
  - {src: IMG_9641.mov, start: 0.0, dur: 1.2, move: pan_right, text: "ネギたっぷりの"}
  - {src: IMG_9641.mov, start: 2.4, dur: 1.2, move: zoom_in,  text: "タン塩も\n外せないし、"}
  - {src: IMG_9645.mov, start: 0.0, dur: 1.2, move: zoom_in,  text: "箸休めのキムチまで"}
  - {src: IMG_9645.mov, start: 2.6, dur: 1.3, move: zoom_out, text: "抜かりなし。"}
  - {src: IMG_9651.mov, start: 0.3, dur: 1.4, move: zoom_in,  text: "ビール片手に\n全部いきたい。"}
