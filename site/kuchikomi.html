function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.setAttribute("style", v);
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function summarize(rs, store) {
  const n = rs.length;
  const dist = [1, 2, 3, 4, 5].map((r) => rs.filter((x) => x.rating === r).length);
  const avg = n ? rs.reduce((s, x) => s + (x.rating || 0), 0) / n : 0;
  const google = rs.filter((x) => x.action === "google").length;
  const feedback = rs.filter((x) => x.feedback).length;
  const cnt = {};
  for (const r of rs) for (const id of r.selectedIds || []) cnt[id] = (cnt[id] || 0) + 1;
  const byCat = CATEGORIES.map((c) => ({ ...c, count: store.options.filter((x) => x.cat === c.id).reduce((s, x) => s + (cnt[x.id] || 0), 0) }));
  const top = store.options.map((x) => ({ ...x, count: cnt[x.id] || 0 })).sort((a, b) => b.count - a.count);
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    days.push({ key: d.toISOString().slice(0, 10), label: `${d.getMonth() + 1}/${d.getDate()}`, count: 0 });
  }
  for (const r of rs) { const d = days.find((x) => x.key === (r.createdAt || "").slice(0, 10)); if (d) d.count++; }
  return { n, dist, avg, google, rate: n ? google / n : 0, feedback, byCat, top, days };
}
function needFive(avg, count, target) {
  avg = +avg; count = +count; target = +target;
  if (!(target > 0) || target >= 5 || !(count >= 0) || !(avg >= 0)) return null;
  if (avg >= target) return 0;
  return Math.max(0, Math.ceil((target * count - avg * count) / (5 - target) - 1e-9));
}

  if (survey.step === "generating") {

  }

  if (survey.step === "draft") {

}

async function makeDraft(store, again) {
  setSurvey({ step: "generating" }, store);
  const selected = store.options.filter((x) => survey.selectedIds.includes(x.id));
  const r = await aiReview({ store, rating: survey.rating, purpose: survey.purpose, selected, comment: survey.comment, lang: survey.lang }, (text) => {
    const el = document.getElementById("genText"); if (el) el.textContent = text;
  });
  survey.draft = r.text;
  if (!again) await saveResponse(store, { action: "drafted", reviewSource: r.source });
  setSurvey({ step: "draft" }, store);
}

async function finish(store, action) {
  if (survey.step === "done") return;
  await saveResponse(store, { action });
  const c = store.coupon || {};
  if (c.enabled && c.mode === "lottery" && survey.won === null) survey.won = Math.random() * 100 < +c.winRate;
  setSurvey({ step: "done" }, store);
}

    h("div", { class: "row savebar" }, h("button", { class: "btn btn-primary" }, "保存する"), msg, h("span", { class: "spacer" }), h("button", { type: "button", class: "btn btn-danger", onclick: askDelete }, "店舗を削除")));
}

function qrPanel(store) {
  const link = surveyLink(store.id);
  const copied = h("span", { class: "ok", hidden: true }, "コピーしました");
  return h("div", { class: "grid" },
    h("section", { class: "panel stack" },
      h("h3", {}, "表示画面のURL"),
      h("div", { class: "url-box" }, h("code", {}, link),
        h("button", { class: "btn", onclick: async () => { await copyText(link); copied.hidden = false; } }, "コピー")),
      copied,
      h("a", { class: "btn", href: "#r-" + store.id }, "この店舗の表示画面を開く"),
      h("p", { class: "muted", style: "margin:0" }, "QRコードを読んだ人がこのページを開くには、claude.ai へのログインとこのページへのアクセス権が必要です。一般のお客様向けに公開するときは、リポジトリのVercel版をお使いください。")),
    h("section", { class: "panel stack center" },
      h("h3", {}, "店頭POP"),
      h("div", { class: "pop" },
        h("div", { class: "pop-store" }, store.name),
        h("div", { class: "pop-catch" }, "ご感想をお聞かせください"),
        h("div", { style: "font-size:.85rem" }, "30秒のアンケートにご協力ください"),
        h("div", { class: "pop-qr", id: "qrBox", role: "img", "aria-label": "アンケートのQRコード" }),
        store.coupon && store.coupon.enabled && store.coupon.title ? h("div", { class: "pop-coupon" }, "回答特典：" + store.coupon.title + (store.coupon.mode === "lottery" ? "（抽選）" : "")) : null,
        h("div", { style: "font-size:.72rem;color:#5d6762;margin-top:6px" }, "English / 中文 / 한국어 OK")),
      cap.downloads ? h("div", {}, h("button", { class: "btn btn-primary", onclick: () => saveQr(store) }, "QR画像を保存")) : null));
}
function drawQr(store) {
  const box = document.getElementById("qrBox");
  if (!box) return;
  box.replaceChildren();
  if (typeof QRCode !== "function") { box.append(h("p", { class: "muted" }, "QRコードを表示できませんでした")); return; }
  new QRCode(box, { text: surveyLink(store.id), width: 512, height: 512, colorDark: "#1c2320", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
}
async function saveQr(store) {
  const canvas = document.querySelector("#qrBox canvas");
  if (!canvas || !cap.downloads) return;
  const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
  try { await cap.downloads.save({ filename: `qr-${store.name || store.id}.png`, data: blob }); } catch {}
}

function responsesPanel(store) {
  const name = (id) => (store.options.find((x) => x.id === id) || {}).label;
  const ACTION = { google: "Google投稿へ", skip: "投稿せず", feedback: "改善要望", drafted: "下書き作成のみ" };
  const filter = state.respFilter || "all";
  const list = state.responses.filter((r) => filter === "low" ? r.rating <= 2 : filter === "google" ? r.action === "google" : true);
  const toCsv = () => {
    const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const rows = [["日時", "満足度", "利用シーン", "良かった点", "コメント", "口コミ下書き", "改善要望", "行動", "言語"],
      ...state.responses.map((r) => [r.createdAt, r.rating, r.purpose, (r.selectedIds || []).map(name).filter(Boolean).join(" / "), r.comment, r.review, r.feedback, ACTION[r.action] || r.action, r.lang])];
    return "﻿" + rows.map((r) => r.map(esc).join(",")).join("\n");
  };
  return h("section", { class: "panel stack" },
    h("div", { class: "row" },
      [["all", "すべて"], ["low", "低評価（★1〜2）"], ["google", "Google投稿へ進んだ"]].map(([k, v]) =>
        h("button", { class: "chip", "aria-pressed": String(filter === k), onclick: () => { state.respFilter = k; renderAdmin(); } }, v)),
      h("span", { class: "spacer" }),
      cap.downloads ? h("button", { class: "btn", disabled: !state.responses.length, onclick: async () => {
        try { await cap.downloads.save({ filename: `${store.name || "responses"}.csv`, data: new Blob([toCsv()], { type: "text/csv" }) }); } catch {}
      } }, "CSVで保存") : null),
    list.length ? h("ul", { class: "list" }, list.map((r) => h("li", { class: "item" + (r.rating <= 2 ? " low" : "") },
      h("div", { class: "row" },
        h("span", { class: "stars-static" }, "★".repeat(r.rating) + "☆".repeat(5 - r.rating)),
        h("span", { class: "tag" + (r.action === "google" ? " tag-google" : r.action === "feedback" ? " tag-bad" : "") }, ACTION[r.action] || r.action),
        r.purpose ? h("span", { class: "tag" }, r.purpose) : null,
        r.lang && r.lang !== "ja" ? h("span", { class: "tag" }, LANGS[r.lang]) : null,
        h("span", { class: "spacer" }),
        h("time", { class: "muted" }, r.createdAt ? new Date(r.createdAt).toLocaleString("ja-JP") : "")),
      (r.selectedIds || []).length ? h("div", { class: "chips" }, r.selectedIds.map(name).filter(Boolean).map((n) => h("span", { class: "tag" }, n))) : null,
      r.feedback ? h("p", { class: "feedback" }, "改善要望：" + r.feedback) : null,
      r.review ? h("p", {}, r.review) : null)))
      : h("p", { class: "muted" }, state.responses.length ? "該当する回答はありません。" : "まだ回答がありません。"));
}

function replyPanel(store) {
  const rating = h("select", { id: "rRating" }, [5, 4, 3, 2, 1].map((n) => h("option", { value: n }, "★" + n)));
  const review = h("textarea", { id: "rReview", rows: 5, placeholder: "Googleに届いた口コミを貼り付けてください" });
  const out = h("textarea", { id: "rOut", rows: 8, hidden: true });
  const note = h("p", { class: "muted", hidden: true, style: "margin:0" });
  const ngEl = h("p", { class: "err", hidden: true, style: "margin:0" });
  const copyBtn = h("button", { type: "button", class: "btn", hidden: true, onclick: () => copyText(out.value) }, "コピー");
  const checkNg = () => { const x = findNg(out.value, store.ngWords); ngEl.hidden = !x.length; ngEl.textContent = "NGワードが含まれています：" + x.join("、"); };
  out.addEventListener("input", checkNg);
  const btn = h("button", { class: "btn btn-primary" }, "返信文を作る");
  return h("form", { class: "panel form", onsubmit: async (e) => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = "作成中…"; out.hidden = false; out.value = "考えています…";
    const r = await aiReply(store, +rating.value, review.value, (t) => { out.value = t; });
    out.value = r.text; checkNg();
    note.hidden = false; note.textContent = r.source === "ai" ? "AIが作った案です。内容を確認してからGoogleで返信してください。" : "AIが使えないため、定型文で作成しました。";
    copyBtn.hidden = false; btn.disabled = false; btn.textContent = "もう一度作る";
  } },
    h("h3", {}, "口コミへの返信文を作る"),
    h("label", { class: "field" }, "口コミの評価", rating),
    h("label", { class: "field" }, "口コミ本文", review),
    h("div", {}, btn), out, ngEl, note, h("div", {}, copyBtn));
}

function simulator(store) {
  const gs = store.googleStats || {};
  const rating = h("input", { id: "simRating", type: "number", step: "0.1", min: 1, max: 5, value: gs.rating || "", placeholder: "4.2" });
  const count = h("input", { id: "simCount", type: "number", min: 0, value: gs.count || "", placeholder: "120" });
  const target = h("input", { id: "simTarget", type: "number", step: "0.01", min: 1, max: 4.99, placeholder: "4.5" });
  const out = h("div", { class: "stack" });
  const monthAgo = Date.now() - 30 * 864e5;
  const perMonth = state.responses.filter((r) => r.action === "google" && r.rating === 5 && new Date(r.createdAt) > monthAgo).length;
  const saved = h("span", { class: "ok", hidden: true }, "保存しました");
  const draw = () => {
    const a = +rating.value, c = +count.value;
    if (!(a > 0 && a <= 5) || count.value === "" || !(c >= 0)) { out.replaceChildren(h("p", { class: "muted" }, "現在の評価と件数を入れてください。")); return; }
    const rows = [0.1, 0.2, 0.3, 0.5].map((d) => Math.round((a + d) * 10) / 10).filter((t) => t < 5);
    const custom = target.value ? needFive(a, c, target.value) : null;
    out.replaceChildren(
      h("div", { class: "table-wrap" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "目標"), h("th", {}, "必要な★5の件数"), h("th", {}, "到達の目安"))),
        h("tbody", {}, rows.map((t) => { const n = needFive(a, c, t); return h("tr", {}, h("td", {}, "★" + t.toFixed(1)), h("td", {}, h("b", {}, n), " 件"), h("td", {}, perMonth ? `約${Math.ceil(n / perMonth)}ヶ月` : "—")); })))),
      custom !== null ? h("p", { class: "result", style: "margin:0" }, `★${(+target.value).toFixed(2)} まで、あと `, h("b", {}, custom), " 件の★5口コミが必要です") : null,
      h("p", { class: "muted", style: "margin:0" }, `直近30日に★5の回答からGoogle投稿へ進んだのは ${perMonth} 件です。到達の目安はこのペースで計算しています。`));
  };
  [rating, count, target].forEach((el) => el.addEventListener("input", draw));
  queueMicrotask(draw);
  return h("section", { class: "panel form" },
    h("h3", {}, "Google評価シミュレーター"),
    h("p", { class: "muted", style: "margin:0" }, "Googleマップに表示されている今の評価と件数から、目標の評価までに必要な★5口コミの件数を計算します。"),
    h("div", { class: "row" }, h("label", { class: "field", style: "flex:1;min-width:140px" }, "今の評価", rating), h("label", { class: "field", style: "flex:1;min-width:140px" }, "今の件数", count)),
    h("div", { class: "row" }, h("button", { type: "button", class: "btn", onclick: async () => {
      try { await cap.db.doc("stores/" + store.id).update({ googleStats: { rating: rating.value, count: count.value } }); saved.hidden = false; } catch {}
    } }, "この数値を保存"), saved),
    h("label", { class: "field" }, "好きな目標評価で計算", target),
    out);
}

/* ───────── 起動 ───────── */
async function start() {
  render();
  if (!window.claude || !claude.use) {
    state.storesLoaded = true;
    mount(h("div", { class: "notice" }, h("h2", {}, "口コミアシスト"), h("p", { class: "muted" }, "このページは claude.ai 上で開いてください。")));
    return;
  }
  const [db, user, sample, downloads] = await Promise.all(["db", "user", "sample", "downloads"].map((n) => claude.use(n).catch(() => null)));
  Object.assign(cap, { db, user, sample, downloads });
  state.canAdmin = user ? await user.canEdit().catch(() => false) : false;
  if (!db) {
    state.storesLoaded = true;
    mount(h("div", { class: "notice" }, h("h2", {}, "口コミアシスト"), h("p", { class: "muted" }, "データを読み込めませんでした。claude.ai にログインしてから開き直してください。")));
    return;
  }
  db.collection("stores").onSnapshot((snap) => {
    state.stores = snap.docs.map((d) => ({ ...d.data(), id: d.id })).sort((a, b) => ((a.createdAt || "") < (b.createdAt || "") ? -1 : 1));
    state.storesLoaded = true;
    const r = route();
    // 入力中のアンケートや設定フォームを上書きしないよう、必要なときだけ描き直す
    if (r.view === "survey" && survey && survey.step !== "rate") return;
    if (r.view === "admin" && state.tab === "settings" && currentStore() && !creating) {
      const sel = document.getElementById("storeSel");
      if (sel && sel.options.length === state.stores.length) return;
    }
    render();
  }, () => { state.storesLoaded = true; render(); });
  subscribeResponses();
}
start();
</script>
